<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Mercado Livre</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      color: #fff;
    }
    .card {
      background: #222;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #333;
    }
    .status {
      color: #00e676;
      font-weight: bold;
    }
    code {
      background: #333;
      padding: 4px 8px;
      border-radius: 4px;
      color: #ffe800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>API Mercado Livre</h1>
    <p>Status: <span class="status">Online & Ativa</span></p>
    <p>Endpoint do Token: <code>/api/token</code></p>
  </div>
</body>
</html>
